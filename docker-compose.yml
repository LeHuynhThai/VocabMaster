services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "VocabMaster@123"
      ACCEPT_EULA: "Y"
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/VocabMaster.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__ApplicationDbContext=Server=db;Database=VocabMaster;User Id=sa;Password=VocabMaster@123;MultipleActiveResultSets=true;TrustServerCertificate=True
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: on-failure

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:

